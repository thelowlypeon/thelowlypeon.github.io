---
layout: default
---

<div>
  <header class="post-header">
    <div class="project-feature bottom-buffer" id="feature-{{ page.slug }}">
      <div class="narrow">
        <a href="{{ page.url }}"><img src="/assets/images/{{ page.image }}" width="180px" height="180px" class="img-circle drop-shadow" /></a>
        <h1><a href="{{ page.url }}">{{ page.title }}</a></h1>
      </div>
    </div>
  </header>

  <div class="post-content" itemprop="articleBody" style="text-align:center">
    {{ page.content }}
  </div>
</div>
